<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuestPro API Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 50px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }
    .topbar-title { font-size: 13px; font-weight: 700; color: #0f172a; }
    .topbar-spacer { flex: 1; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .badge.active { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 8px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s,
                  transform 0.1s cubic-bezier(0.23,1,0.32,1);
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-ghost   { background: #f8fafc; border-color: #e2e8f0; color: #374151; }
    .btn-primary { background: #76b51b; border-color: #76b51b; color: #fff; }
    .btn-danger  { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    @media (hover: hover) and (pointer: fine) {
      .btn-ghost:hover   { background: #f1f5f9; border-color: #cbd5e1; }
      .btn-primary:hover { background: #5e9016; border-color: #5e9016; }
      .btn-danger:hover  { background: #fee2e2; }
    }

    /* ── Calendar ── */
    .cal-wrap { flex: 1; min-height: 0; overflow: hidden; padding: 32px; background: #f1f5f9; }
    .cal-container { height: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    room-calendar { display: block; height: 100%; }

    /* ── Modal overlay ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease-out;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    /* ── Modal dialog ── */
    .dialog {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
      width: 100%; max-width: 420px;
      transform: scale(0.95) translateY(8px); opacity: 0;
      transition: transform 0.2s cubic-bezier(0.23,1,0.32,1), opacity 0.2s ease-out;
    }
    .overlay.open .dialog { transform: scale(1) translateY(0); opacity: 1; }

    .dialog-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 0;
    }
    .dialog-title { display: flex; align-items: center; gap: 10px; }
    .dialog-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: #76b51b;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .dialog-title-text { font-size: 15px; font-weight: 700; color: #0f172a; }
    .dialog-subtitle   { font-size: 11px; color: #94a3b8; margin-top: 1px; }
    .dialog-close {
      width: 28px; height: 28px; border-radius: 7px; border: none;
      background: #f1f5f9; color: #64748b; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .dialog-close:hover { background: #e2e8f0; color: #374151; }

    .dialog-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 11px; font-weight: 600; color: #64748b; letter-spacing: 0.02em; }
    .field input, .field textarea {
      padding: 9px 12px;
      font-size: 13px; font-family: inherit;
      border: 1.5px solid #e2e8f0; border-radius: 9px;
      outline: none; color: #0f172a; background: #fafafa;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
    }
    .field input:focus, .field textarea:focus { border-color: #76b51b; background: #fff; }
    .field input::placeholder, .field textarea::placeholder { color: #cbd5e1; }
    .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; }

    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    .dialog-footer { padding: 0 20px 18px; display: flex; gap: 8px; }
    .dialog-footer .btn { flex: 1; justify-content: center; padding: 10px; font-size: 13px; }

    .status-bar {
      margin: 0 20px 14px; padding: 9px 12px;
      border-radius: 9px; font-size: 12px; line-height: 1.4; display: none;
    }
    .status-bar.show    { display: block; }
    .status-bar.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .status-bar.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status-bar.loading { background: #fefce8; color: #92400e; border: 1px solid #fef08a; }

    /* ── Calendar loading overlay ── */
    .cal-container { position: relative; }
    .cal-loading-overlay {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(1px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s ease-out;
      border-radius: 12px;
    }
    .cal-loading-overlay.show { opacity: 1; pointer-events: auto; }
    .cal-spinner {
      width: 28px; height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #76b51b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; translate: -50% 0;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.14), 0 1px 4px rgba(0,0,0,0.08);
      z-index: 9999; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.18s ease-out, transform 0.18s cubic-bezier(0.23,1,0.32,1);
    }
    .toast.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .toast.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .toast.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<!-- ── Top bar ── -->
<div class="topbar">
  <span class="topbar-title">GuestPro Demo</span>
  <span class="badge" id="status-badge"><span class="badge-dot"></span>No token</span>
  <div class="topbar-spacer"></div>
  <button class="btn btn-ghost" id="load-btn" onclick="openLoadModal()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
    Load Data
  </button>
  <button class="btn btn-primary" onclick="openTokenModal()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Set Token
  </button>
</div>

<!-- ── Calendar ── -->
<div class="cal-wrap">
  <div class="cal-container">
    <room-calendar id="cal"></room-calendar>
    <div class="cal-loading-overlay" id="cal-loading">
      <div class="cal-spinner"></div>
    </div>
  </div>
</div>

<!-- ── Token modal ── -->
<div class="overlay" id="token-overlay" onpointerdown="onOverlayClick(event,'token-overlay')">
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <div class="dialog-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div>
          <div class="dialog-title-text">Bearer Token</div>
          <div class="dialog-subtitle">Paste token dari GuestPro PMS</div>
        </div>
      </div>
      <button class="dialog-close" onclick="closeModal('token-overlay')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <span class="field-label">Token</span>
        <textarea id="token-input" placeholder="eyJhbGciOiJIUzI1NiIs…" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="status-bar" id="token-status"></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="clearToken()">Clear</button>
      <button class="btn btn-primary" onclick="saveToken()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Use Token
      </button>
    </div>
  </div>
</div>

<!-- ── Load data modal ── -->
<div class="overlay" id="load-overlay" onpointerdown="onOverlayClick(event,'load-overlay')">
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <div class="dialog-icon" style="background:#3b82f6">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="2.2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        </div>
        <div>
          <div class="dialog-title-text">Load Calendar Data</div>
          <div class="dialog-subtitle">Fetch rooms &amp; reservations from API</div>
        </div>
      </div>
      <button class="dialog-close" onclick="closeModal('load-overlay')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <span class="field-label">Start Date</span>
        <input id="date-from" type="date" />
      </div>
    </div>
    <div class="status-bar" id="load-status"></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeModal('load-overlay')">Cancel</button>
      <button class="btn btn-danger" onclick="clearCalendar()">Clear</button>
      <button class="btn btn-primary" id="do-load-btn" onclick="loadCalendarData()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        Load
      </button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script type="module">
import { register } from './src/index.ts'
register()

// ── API config ───────────────────────────────────────────────────────────────
// Requests go via Vite proxy (/gp-api → https://core-api.guestpro.id) — no CORS.
const BASE_URL    = 'https://core-api.guestpro.id/api'
const COMPANY_ID  = 'bf32c930-8bfd-11e9-8291-9f143c8ac640'
const ENDPOINTS   = { roomCharting: 'calendar_reservation_resource_list', reservations: 'calendar_reservation_data_list', company: `company/${COMPANY_ID}`, calendarConfig: `calender_configuration/${COMPANY_ID}`, moveReservation: id => `move_reservation-v2/${id}` }

// ── LocalStorage ─────────────────────────────────────────────────────────────
const LS_KEY = 'gp-demo'
function lsGet(k)   { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}')[k] ?? '' } catch { return '' } }
function lsSet(obj) { try { const c = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); localStorage.setItem(LS_KEY, JSON.stringify({ ...c, ...obj })) } catch {} }

const $ = id => document.getElementById(id)

// ── Restore ───────────────────────────────────────────────────────────────────
$('date-from').value = lsGet('dateFrom') || '2026-05-22'

// ── Calendar ──────────────────────────────────────────────────────────────────
let bearerToken = lsGet('token') || ''
const cal = $('cal')
cal.config = { startDate: $('date-from').value || todayIso(), visibleDays: 30 }
cal.addEventListener('date-range-changed', e => { cal.config = { ...cal.config, startDate: e.detail.startDate } })
cal.addEventListener('filter-search', e => {
  const p = Array.isArray(e.detail) ? e.detail[0] : e.detail
  const dateFrom = p.startDate || $('date-from').value
  if (!bearerToken || !dateFrom) return
  const dateTo = addDays(dateFrom, 29)
  loadCalendarData(dateFrom, dateTo)
})
cal.addEventListener('calendar-config-saved', e => {
  const cfg = Array.isArray(e.detail) ? e.detail[0] : e.detail
  saveCalendarConfig(cfg)
})
cal.addEventListener('reservation-moved', e => {
  const p = Array.isArray(e.detail) ? e.detail[0] : e.detail
  moveReservation(p)
})
cal.addEventListener('infinite-scroll-load', e => {
  const p = Array.isArray(e.detail) ? e.detail[0] : e.detail
  fetchAndAppendReservations(p.startDate, p.endDate)
})
if (bearerToken) setTokenBadge(true)

// ── Token modal ───────────────────────────────────────────────────────────────
window.openTokenModal = function () {
  $('token-input').value = bearerToken
  clearStatus('token-status')
  openModal('token-overlay')
  setTimeout(() => $('token-input').focus(), 50)
}

window.saveToken = async function () {
  const token = $('token-input').value.trim()
  if (!token) return setStatus('token-status', 'error', 'Token cannot be empty.')
  bearerToken = token
  lsSet({ token })
  setTokenBadge(true)
  closeModal('token-overlay')
  await Promise.all([fetchCalendarConfig(), loadCalendarData()])
}

async function moveReservation(payload) {
  if (!bearerToken) return
  const reservationId = payload.id.split(';')[0]
  const headers = { 'Authorization': `Bearer ${bearerToken}`, 'Accept': 'application/json', 'Content-Type': 'application/json' }
  const loader = $('cal-loading')
  loader.classList.add('show')
  try {
    const res = await fetch(`${BASE_URL}/${ENDPOINTS.moveReservation(reservationId)}`, {
      method: 'PUT',
      headers,
      body: JSON.stringify({
        company_id:     COMPANY_ID,
        arrival_date:   payload.arrival_date,
        departure_date: payload.departure_date,
        id:             reservationId,
        room_id:        payload.room_id,
      }),
    })
    const json = await res.json().catch(() => null)
    if (!res.ok || json?.error) {
      cal.revertLastMove()
      showToast('error', json?.message || `Move failed (HTTP ${res.status})`)
      return
    }
    const hotReload = json?.data?.hot_reload_reservation
    if (Array.isArray(hotReload) && hotReload.length) {
      cal.updateReservations(hotReload)
    }
  } catch (err) {
    cal.revertLastMove()
    showToast('error', 'Move failed — network error')
  } finally {
    loader.classList.remove('show')
  }
}

async function saveCalendarConfig(cfg) {
  if (!bearerToken) return
  const headers = { 'Authorization': `Bearer ${bearerToken}`, 'Accept': 'application/json', 'Content-Type': 'application/json' }
  try {
    await fetch(`${BASE_URL}/${ENDPOINTS.calendarConfig}`, { method: 'PUT', headers, body: JSON.stringify(cfg) })
  } catch {}
}

async function fetchCalendarConfig() {
  if (!bearerToken) return
  const headers = { 'Authorization': `Bearer ${bearerToken}`, 'Accept': 'application/json' }
  try {
    const res = await fetch(`${BASE_URL}/${ENDPOINTS.company}`, { headers })
    if (!res.ok) return
    const data = await res.json()
    const cfg = data?.data ?? data
    cal.setCalendarConfiguration(cfg)
  } catch {}
}

window.clearToken = function () {
  bearerToken = ''
  lsSet({ token: '' })
  $('token-input').value = ''
  setTokenBadge(false)
  closeModal('token-overlay')
}

// ── Load data ─────────────────────────────────────────────────────────────────
window.openLoadModal = function () {
  clearStatus('load-status')
  openModal('load-overlay')
}

window.loadCalendarData = async function (overrideDateFrom, overrideDateTo) {
  const dateFrom = overrideDateFrom || $('date-from').value
  const dateTo   = overrideDateTo   || addDays(dateFrom, 30)
  const fromModal = !overrideDateFrom

  if (!dateFrom) return fromModal && setStatus('load-status', 'error', 'Start date is required.')

  if (fromModal) {
    lsSet({ dateFrom })
    setStatus('load-status', 'loading', 'Fetching rooms and reservations…')
    $('do-load-btn').disabled = true
  }

  const headers = { 'Authorization': `Bearer ${bearerToken}`, 'Accept': 'application/json' }

  try {
    const roomParams = new URLSearchParams({ company_id: COMPANY_ID, is_unallocated: '1', room_type_id: 'all', tags: '' })
    const resvParams = new URLSearchParams({ company_id: COMPANY_ID, room_type_id: 'all', icon_code: 'all', open_availability: '0', start_date: dateFrom, end_date: dateTo, tags: '' })

    const fetches = fromModal
      ? [fetch(`${BASE_URL}/${ENDPOINTS.roomCharting}?${roomParams}`, { headers }),
         fetch(`${BASE_URL}/${ENDPOINTS.reservations}?${resvParams}`, { headers })]
      : [Promise.resolve(null),
         fetch(`${BASE_URL}/${ENDPOINTS.reservations}?${resvParams}`, { headers })]

    const [roomsRes, resvRes] = await Promise.all(fetches)

    if (fromModal && !roomsRes.ok) throw new Error(`Room charting: HTTP ${roomsRes.status}`)
    if (!resvRes.ok) throw new Error(`Reservations: HTTP ${resvRes.status}`)

    const resvJson  = await resvRes.json()

    if (fromModal) {
      const roomsJson = await roomsRes.json()
      const rooms     = Array.isArray(roomsJson) ? roomsJson : (roomsJson?.data ?? [])
      const resvCount = Array.isArray(resvJson)  ? resvJson.length : (resvJson?.data?.length ?? 0)
      cal.setData(rooms)
      cal.loadReservation(resvJson)
      cal.config = { ...cal.config, startDate: dateFrom, visibleDays: 30 }
      setStatus('load-status', 'success', `Loaded ${rooms.length} rooms · ${resvCount} reservations`)
      setTimeout(() => closeModal('load-overlay'), 1000)
    } else {
      cal.loadReservation(resvJson)
    }

  } catch (err) {
    if (fromModal) setStatus('load-status', 'error', err.message || String(err))
  } finally {
    if (fromModal) $('do-load-btn').disabled = false
  }
}

async function fetchAndAppendReservations(dateFrom, dateTo) {
  if (!bearerToken) return
  const headers = { 'Authorization': `Bearer ${bearerToken}`, 'Accept': 'application/json' }
  const resvParams = new URLSearchParams({ company_id: COMPANY_ID, room_type_id: 'all', icon_code: 'all', open_availability: '0', start_date: dateFrom, end_date: dateTo, tags: '' })
  try {
    const res = await fetch(`${BASE_URL}/${ENDPOINTS.reservations}?${resvParams}`, { headers })
    if (!res.ok) return
    const data = await res.json()
    cal.appendReservation(data)
  } catch {}
}

window.clearCalendar = function () {
  cal.setData([])
  cal.loadReservation({ data: [] })
  closeModal('load-overlay')
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function openModal(id)  { $(id).classList.add('open') }
window.closeModal = id  => $(id).classList.remove('open')
window.onOverlayClick = (e, id) => { if (e.target === $(id)) closeModal(id) }

// ── UI helpers ────────────────────────────────────────────────────────────────
function setTokenBadge(on) {
  const badge = $('status-badge')
  badge.className = 'badge' + (on ? ' active' : '')
  badge.innerHTML = `<span class="badge-dot"></span>${on ? 'Token set' : 'No token'}`
  $('load-btn').disabled = !on
}

function setStatus(id, type, msg) {
  const el = $(id)
  el.className = `status-bar ${type} show`
  el.textContent = msg
}

function clearStatus(id) {
  const el = $(id); el.className = 'status-bar'; el.textContent = ''
}

function todayIso() { return new Date().toISOString().slice(0, 10) }
function addDays(iso, n) { const d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10) }

let toastTimer = null
function showToast(type, msg) {
  const el = $('toast')
  el.className = `toast ${type} show`
  el.textContent = msg
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.className = 'toast' }, 3500)
}

if (bearerToken) Promise.all([fetchCalendarConfig(), loadCalendarData()])
</script>
</body>
</html>
